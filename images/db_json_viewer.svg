<svg width="200" height="100" viewBox="0 0 400 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- JSON green -->
    <linearGradient id="dbjJson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7D32"/>
      <stop offset="1" stop-color="#66BB6A"/>
    </linearGradient>
    <!-- Compare orange -->
    <linearGradient id="dbjDiff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
  </defs>

  <!-- Background (transparent / card will clip it) -->
  <rect x="0" y="0" width="400" height="260" fill="#FFFFFF00"/>

  <!-- Left JSON block (aligned with cad_compare.svg sheets) -->
  <g transform="translate(40,44) scale(1.3)">
    <rect x="0" y="0" width="112" height="140" rx="8" fill="#F4F7FB" stroke="#D1D9E8" stroke-width="1"/>
    <!-- JSON braces -->
    <text x="24" y="44" text-anchor="middle"
          font-family="Consolas, Menlo, monospace"
          font-size="40" font-weight="600" fill="#2E7D32">
      {
    </text>
    <text x="92" y="96" text-anchor="middle"
          font-family="Consolas, Menlo, monospace"
          font-size="40" font-weight="600" fill="#2E7D32">
      }
    </text>
    <!-- JSON label -->
    <rect x="28" y="104" width="60" height="22" rx="13" fill="#143B7A"/>
    <text x="58" y="119" text-anchor="middle"
          font-family="Segoe UI, Roboto, sans-serif"
          font-size="11" font-weight="600" fill="#FFFFFF">
      DWG
    </text>
  </g>

  <!-- Right JSON block (aligned with cad_compare.svg sheets) -->
  <g transform="translate(206,44) scale(1.3)">
    <rect x="0" y="0" width="112" height="140" rx="8" fill="#F4F7FB" stroke="#D1D9E8" stroke-width="1"/>
    <!-- JSON braces, mirrored -->
    <text x="24" y="44" text-anchor="middle"
          font-family="Consolas, Menlo, monospace"
          font-size="40" font-weight="600" fill="#2E7D32">
      {
    </text>
    <text x="92" y="96" text-anchor="middle"
          font-family="Consolas, Menlo, monospace"
          font-size="40" font-weight="600" fill="#2E7D32">
      }
    </text>
    <!-- JSON label -->
    <rect x="28" y="104" width="60" height="22" rx="13" fill="#19A6C5"/>
    <text x="58" y="119" text-anchor="middle"
          font-family="Segoe UI, Roboto, sans-serif"
          font-size="11" font-weight="600" fill="#FFFFFF">
      DXF
    </text>
  </g>

  <!-- Center compare / diff indicator (aligned with widened JSON blocks and cad_compare.svg) -->
  <g transform="translate(163,84) scale(1.3)">
    <!-- vertical divider -->
    <rect x="24" y="-40" width="2" height="120" fill="#D1D9E8"/>

    <!-- <> icon for diff (centered around split line) -->
    <g transform="translate(-8,0)">
      <path d="M0 20L16 6V14L8 20L16 26V34L0 20Z" fill="url(#dbjDiff)"/>
      <path d="M48 6L64 20L48 34V26L56 20L48 14V6Z" fill="url(#dbjDiff)"/>
    </g>

    <!-- small arrows to indicate direction -->
    <path d="M10 -10L22 -4L10 2" fill="none" stroke="#90CAF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 50L28 44L40 38" fill="none" stroke="#90CAF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>


