<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" type="text/css" href="./global.css" />
    <title>x-viewer samples</title>
    <style type="text/css">
        body {
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            background: #f8f9fb;
            margin: 0;
            padding: 0 0 0 0;
            color: #222;
            font-size: 16px;
        }
        .header {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            margin-top: 0;
            padding: 36px 0 18px 0;
            background: linear-gradient(90deg, #f6f6f6 60%, #e9e4e0 100%);
            border-bottom: 1.5px solid #ebeef5;
            box-shadow: 0 2px 8px 0 rgba(109, 76, 65, 0.04);
            letter-spacing: 1px;
        }
        .project-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
            padding: 10px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, .1);
        }
        .project-card {
            width: 100%;
            display: inline-block;
        }
        .project-card-main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
            min-width: 150px;
            background-color: #fff;
            color: #303133;
            margin-bottom: 10px;
            border: 1px solid rgba(109, 76, 65, .5);
            margin: 1px;
            transition: all .1s;
            opacity: 0.95;
            background-color: #f6f6f6;
        }
        .project-card-main:hover {
            cursor: pointer;
            border: 1px solid rgba(109, 76, 65, 1.0);
            opacity: 1.0;
            box-shadow: 3px 5px 10px rgba(109, 76, 65, 0.5);
        }
        .project-card-thumbnail {
            height: 150px;
            flex-shrink: 0;
            background-repeat: no-repeat;
            background-position: 50%;
            background-size: cover;
            box-shadow: 0 0 1px rgba(0, 0, 0, .3);
            transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
        }
        .project-card-main:hover .project-card-thumbnail {
            transform: scale(1.1);
        }
        .project-card-desc {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            background: #f6f6f6;
            text-align: center;
            font-size: 14px;
            padding: 2px;
            line-height: 35px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            z-index: 1;
            position: relative;
        }
        .project-card-desc-text {
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .footer {
            width: 100%;
            background: #f6f6f6;
            color: #333;
            padding: 20px 0 10px 0;
            text-align: center;
            margin-top: 40px;
            font-size: 16px;
            border-top: 1px solid #ebeef5;
            box-shadow: 0 -1px 6px 0 rgba(109, 76, 65, 0.05);
        }
        .footer-content a {
            color: #3a6aca;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .footer-content a:hover {
            color: #6d4c41;
            text-decoration: underline;
        }
        .footer-content .footer-link {
            color: #3a6aca;
            text-decoration: none;
            font-weight: 500;
            margin-left: 4px;
            transition: color 0.2s;
        }
        .footer-content .footer-link:hover {
            color: #6d4c41;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="header">dxf-viewer examples</div>
    <div class="project-cards"></div>
    <!--
    <div><a href="./upload_dxf.html">Upload local dxf/pdf</a></div>
    <br />
    <div><a href="./dxf_0.html">Dxf example 0</a></div>
    <div><a href="./dxf_1.html">Dxf example 1</a></div>
    <div><a href="./dxf_2.html">Dxf example 2</a></div>
    <div><a href="./dxf_compare_1_viewport.html">Dxf example 3 (compare with 1 viewport)</a></div>
    <div><a href="./dxf_compare_2_viewports.html">Dxf example 4 (compare with 2 viewports)</a></div>
    <div><a href="./pdf_1.html">Pdf example 1</a></div>
    <br />
    -->
    <footer class="footer">
      <div class="footer-content">
        Contact: <a href="mailto:thingraph@outlook.com">thingraph@outlook.com</a>
        &nbsp;|&nbsp;
        <a class="footer-link" href="https://github.com/thingraph/dxf-viewer-examples" target="_blank" rel="noopener">GitHub</a>
      </div>
    </footer>
  </body>

  <script type="module">
    const projects = [
      { name: 'Upload local dxf/pdf', thumbnail: './images/upload_dxf.png', link: './upload_dxf.html' },
      { name: 'Dxf example 0', thumbnail: './images/dxf_0.png', link: './dxf_0.html'},
      { name: 'Dxf example 1', thumbnail: './images/dxf_1.png', link: './dxf_1.html' },
      { name: 'Dxf example 2', thumbnail: './images/dxf_2.png', link: './dxf_2.html' },
      { name: 'Dxf example 3 (compare with 1 viewport)', thumbnail: './images/dxf_compare_1.png', link: './dxf_compare_1_viewport.html' },
      { name: 'Dxf example 4 (compare with 2 viewports)', thumbnail: './images/dxf_compare_2.png', link: './dxf_compare_2_viewports.html' },
      { name: 'Pdf example 1', thumbnail: './images/pdf_1.png', link: './pdf_1.html' },
    ];

    const init = () => {
      const projectCardsContainer = document.querySelector('.project-cards');
      projects.forEach(project => {
        const projectCard = document.createElement('div');
        projectCard.classList.add('project-card');
        projectCard.innerHTML = `
          <div class="project-card-main">
            <div class="project-card-thumbnail" style="background-image: url('${project.thumbnail}');"></div>
            <div class="project-card-desc">
              <span class="project-card-desc-text" title="${project.name}">${project.name}</span>
            </div>
          </div>
        `;
        projectCardsContainer.appendChild(projectCard);
        projectCard.onclick = () => {
          window.location.href = project.link;
        };
      });
    };
    init();
  </script>
</html>
